<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <!-- opengraph -->
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title != site.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% if page.image %}
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  {% elsif page.layout == 'post' %}
  <meta property="og:image" content="{{ '/blog_header.jpg' | absolute_url }}">
  {% else %}
  <meta property="og:image" content="{{ '/blog_header.jpg' | absolute_url }}">
  {% endif %}
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header class="page-header">
    <h1><a href="/" style="text-decoration: none; color: inherit;">{{ site.title }}</a></h1>
    <p>{{ site.description }}</p>
  </header>
  
  <main class="main-content">
    {{ content }}
  </main>
  
  <footer class="site-footer">
    <p><a href="/">← all posts</a></p>
    <p><em>{{ site.description }}</em></p>
  </footer>
</body>
</html>
